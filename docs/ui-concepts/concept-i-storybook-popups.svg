      <stop offset="0.58" stop-color="#88D0FF"/>
      <stop offset="1" stop-color="#72B3F8"/>
    </linearGradient>
    <linearGradient id="i_paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F4EBD8"/>
    </linearGradient>
    <linearGradient id="i_orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB46F"/>
      <stop offset="1" stop-color="#FF7A48"/>
