  <text x="265" y="724" text-anchor="middle" fill="#FFEDEA" font-family="Noto Sans KR, sans-serif" font-size="24" font-weight="700">보스 정보 보기</text>
  <text x="547" y="724" text-anchor="middle" fill="#FFF5F2" font-family="Noto Sans KR, sans-serif" font-size="24" font-weight="700">전투 시작</text>
  <text x="1053" y="724" text-anchor="middle" fill="#E9FBFF" font-family="Noto Sans KR, sans-serif" font-size="24" font-weight="700">다음 합성 확인</text>
  <text x="1335" y="724" text-anchor="middle" fill="#072536" font-family="Noto Sans KR, sans-serif" font-size="24" font-weight="700">보드에 배치</text>

  <g font-family="Orbitron, sans-serif" font-size="14" letter-spacing="2">
