  <text x="136" y="224" fill="#FFAE9B" font-family="Orbitron, sans-serif" font-size="14" letter-spacing="3">BOSS ROUND ENTER</text>
  <text x="136" y="252" fill="#FFF5F3" font-family="Noto Sans KR, sans-serif" font-size="28" font-weight="700">마법사 타워가 전장을 잠식합니다</text>
  <text x="924" y="224" fill="#8CDFFF" font-family="Orbitron, sans-serif" font-size="14" letter-spacing="3">MERGE SUCCESS</text>
