    <rect x="136" y="690" width="258" height="56" rx="20" fill="#2B1A24" stroke="#FF8E87" stroke-opacity="0.34"/>
    <rect x="418" y="690" width="258" height="56" rx="20" fill="url(#c_boss)"/>
    <rect x="924" y="690" width="258" height="56" rx="20" fill="#162638" stroke="#54D8FF" stroke-opacity="0.34"/>
