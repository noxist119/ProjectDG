  <g opacity="0.95">
    <rect x="962" y="368" width="58" height="58" rx="18" fill="#243A52"/>
    <rect x="1032" y="368" width="58" height="58" rx="18" fill="#243A52"/>
    <rect x="1102" y="368" width="58" height="58" rx="18" fill="#243A52"/>
    <path d="M1086 398H1110" stroke="#7CDFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M1110 398L1099 389" stroke="#7CDFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1110 398L1099 407" stroke="#7CDFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1132" y="348" width="124" height="96" rx="24" fill="url(#c_merge)"/>
    <text x="1194" y="404" text-anchor="middle" fill="#072435" font-family="Noto Sans KR, sans-serif" font-size="24" font-weight="700">에픽</text>
