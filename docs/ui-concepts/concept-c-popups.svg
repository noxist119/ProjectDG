  <rect x="72" y="808" width="1456" height="44" rx="22" fill="#0E1625" stroke="#31445F" stroke-opacity="0.55"/>
  <text x="98" y="836" fill="#8FAED0" font-family="Noto Sans KR, sans-serif" font-size="18">팁: 현재 게임에서는 이 팝업들을 라운드 배너와 합성 축하 텍스트의 상위 연출로 붙이면 체감이 빠르게 좋아집니다.</text>
