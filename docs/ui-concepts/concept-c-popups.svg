<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c_bg" x1="120" y1="60" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1321"/>
      <stop offset="0.5" stop-color="#101726"/>
      <stop offset="1" stop-color="#0B0F18"/>
    </linearGradient>
    <linearGradient id="c_boss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A74"/>
      <stop offset="1" stop-color="#FF416F"/>
    </linearGradient>
    <linearGradient id="c_merge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33E2BF"/>
      <stop offset="1" stop-color="#45B5FF"/>
    </linearGradient>
    <linearGradient id="c_panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161F31" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0E1523" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="c_shadow" x="-40" y="-40" width="1680" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#050812" flood-opacity="0.5"/>
    </filter>
    <filter id="c_glow" x="-160" y="-160" width="520" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="30" fill="url(#c_bg)"/>
  <circle cx="340" cy="190" r="160" fill="#FF6D74" fill-opacity="0.16" filter="url(#c_glow)"/>
  <circle cx="1240" cy="220" r="160" fill="#44D7FF" fill-opacity="0.14" filter="url(#c_glow)"/>
  <circle cx="1240" cy="700" r="140" fill="#33E2BF" fill-opacity="0.12" filter="url(#c_glow)"/>

  <text x="68" y="82" fill="#D8F2FF" font-family="Orbitron, sans-serif" font-size="28" letter-spacing="3">OVERLAY / POPUP REFERENCES</text>
  <text x="68" y="114" fill="#95AECB" font-family="Noto Sans KR, sans-serif" font-size="18">현재 게임에 이미 있는 보스 배너와 합성 성공 연출을 더 강하게 체감시키는 레퍼런스입니다.</text>

  <g filter="url(#c_shadow)">
    <rect x="72" y="160" width="668" height="620" rx="34" fill="url(#c_panel)" stroke="#FF7F7A" stroke-opacity="0.42" stroke-width="2"/>
    <rect x="860" y="160" width="668" height="620" rx="34" fill="url(#c_panel)" stroke="#54D8FF" stroke-opacity="0.38" stroke-width="2"/>
  </g>

  <g filter="url(#c_shadow)">
    <rect x="104" y="192" width="604" height="78" rx="26" fill="#2A1D28"/>
