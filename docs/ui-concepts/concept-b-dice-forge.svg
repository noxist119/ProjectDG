<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="b_bg" x1="80" y1="40" x2="1510" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1312"/>
      <stop offset="0.48" stop-color="#231824"/>
      <stop offset="1" stop-color="#11141F"/>
    </linearGradient>
    <linearGradient id="b_bronze" x1="0" y1="0" x2="1" y2="1">
